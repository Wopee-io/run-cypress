name: Run Cypress tests
description: 'Runs Cypress tests via npm test'
branding:
  icon: 'fast-forward'
  color: 'purple'

runs:
  using: "composite"
  steps:
    - uses: actions/checkout@v4

    - name: Set default values for environment variables
      shell: bash
      run: |
        echo "WOPEE_SCREENSHOT_VALIDATION_ENABLED=${WOPEE_SCREENSHOT_VALIDATION_ENABLED:-true}" >> $GITHUB_ENV
        echo "WOPEE_COLLECT_PAGE_CONTENT=${WOPEE_COLLECT_PAGE_CONTENT:-true}" >> $GITHUB_ENV

    - name: Load .github/workflows/.env → $GITHUB_ENV
      # Loaded before the dispatch payload, so values sent by Commander win.
      shell: bash
      run: |
        if [ -f .github/workflows/.env ]; then
          # Valid KEY=VALUE lines only; unfilled template placeholders like {wopeeProjectUuid} are skipped.
          grep -vE '^(#|$)' .github/workflows/.env | \
            grep -E '^[A-Za-z_][A-Za-z0-9_]*=' | \
            grep -vE '=\{[A-Za-z]+\}$' \
            >> "$GITHUB_ENV" || true
        fi

    - name: Load client_payload.env → $GITHUB_ENV
      if: github.event.client_payload.env
      shell: bash
      run: |
        jq -r '
          .client_payload.env
          | to_entries[]
          | select(.value != null)
          | if (.value | type=="string" and test("\n"))
              then "\(.key)<<EOF\n\(.value)\nEOF"
              else "\(.key)=\(.value)"
            end
        ' "$GITHUB_EVENT_PATH" >> "$GITHUB_ENV"

    - name: Check project settings
      shell: bash
      run: |
        if [ -z "${WOPEE_PROJECT_UUID:-}" ]; then
          echo "::error title=WOPEE_PROJECT_UUID is not set::Add WOPEE_PROJECT_UUID (and WOPEE_API_URL, WOPEE_PROJECT_URL) as uncommented KEY=value lines to .github/workflows/.env. Commander › More › Settings › API Keys shows the values."
          exit 1
        fi

    - name: Run tests
      id: tests
      shell: bash
      run: |
          npm install --prefer-offline --no-audit
          npm test

    - name: Confirm end of run
      if: always() && github.event.action == 'code'
      shell: bash
      run: |
        if [ -z "${WOPEE_SUITE_UUID:-}" ]; then
          echo "No WOPEE_SUITE_UUID - nothing to confirm"
          exit 0
        fi

        ERROR_FLAG=false
        if [ "${{ steps.tests.outcome }}" != "success" ]; then
          ERROR_FLAG=true
        fi

        IDENTIFIER=""
        if [ -n "${WOPEE_USER_STORY_ID:-}" ] && [ -n "${WOPEE_TEST_CASE_ID:-}" ]; then
          IDENTIFIER="${WOPEE_USER_STORY_ID}:${WOPEE_TEST_CASE_ID}"
        fi

        JSON_PAYLOAD=$(cat <<-EOF
        {
          "query": "mutation PostProcessAgentSuite(\$input: PostProcessAgentSuiteInput!) { postProcessAgentSuite(input: \$input) { postProcessing errorMessage } }",
          "variables": {
            "input": {
              "error": $ERROR_FLAG,
              "projectUuid": "${WOPEE_PROJECT_UUID}",
              "suiteUuid": "${WOPEE_SUITE_UUID}",
              "identifier": "$IDENTIFIER"
            }
          }
        }
        EOF
        )

        curl --request POST \
          --header 'content-type: application/json' \
          --header "api_key: ${WOPEE_API_KEY}" \
          --header "x-api-key: ${WOPEE_API_KEY}" \
          --url "${WOPEE_API_URL}" \
          --data "$JSON_PAYLOAD"

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: cypress-results
        path: |
          cypress/videos
          cypress/screenshots
          cypress/results
          cypress/reports
          cypress/logs
        if-no-files-found: ignore
        retention-days: 1